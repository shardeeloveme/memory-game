<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Найди пару</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Найди пару</h1>
    <div class="stats">
      <div>Счёт: <b id="score">0</b></div>
      <div>Ходы: <b id="moves">0</b></div>
      <button id="restart" type="button">Заново</button>
    </div>
    <div id="board" class="board" aria-label="Игровое поле"></div>
    <p id="message" class="message" role="status"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
